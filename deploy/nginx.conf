# Put the map in the http context, not inside a server block.
map $http_upgrade $codingbox_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name app.boxlite.ai;

    ssl_certificate /etc/codingbox/tls/fullchain.pem;
    ssl_certificate_key /etc/codingbox/tls/privkey.pem;

    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codingbox_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
